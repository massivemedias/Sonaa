name = "sonaa-sets"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# LE COMPTE EST ECRIT, PAS DEVINE. Le poste porte deux comptes Cloudflare, et
# wrangler continuait de viser l'ancien apres une reconnexion : « Authentication
# error » sur un compte ou le jeton n'a plus rien a faire. Ecrire le compte ici
# supprime la question.
account_id = "48c0f0149933a7f0e3a24479e33c69d3"

# LE SEUL ROLE DE CE WORKER : etre la serrure devant R2.
#
# R2 n'a pas de notion de « qui est connecte ». Sans passerelle il faudrait
# donner au navigateur une cle d'ecriture, ce qui reviendrait a publier la cle
# du dépôt. Le Worker verifie donc le jeton Supabase, refuse tout ce qui sort
# du dossier de son porteur, et laisse passer le reste.
[[r2_buckets]]
binding = "SETS"
bucket_name = "sonaa-sets"

[vars]
# L'adresse du projet Supabase sert a aller chercher les cles publiques qui
# signent les jetons. Aucun secret ici : ce sont des cles PUBLIQUES, et c'est
# tout l'interet de la signature asymetrique.
SUPABASE_URL = "https://pqgapyfqkjzvwkulxnhv.supabase.co"
ORIGINES = "https://sonaa.ca,http://localhost:5173,http://localhost:4173"
