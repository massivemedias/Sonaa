<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SONAA</title>
    <meta
      name="description"
      content="Atlas généalogique des musiques électroniques. 218 genres, 14 familles, écoute par le lecteur officiel YouTube."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c10" />

    <!-- Identité. Les chemins sont relatifs : le site est servi sous /Sonaa/ et
         aucune URL absolue vers le domaine n'est écrite en dur, sauf dans les
         métadonnées Open Graph, dont la spécification l'exige. -->
    <!-- Icônes : toutes issues de SonaaLogoCircle.png, le logo rond, jamais
         redessinées, et toutes le disque ENTIER, favicons compris. À 16
         pixels le lettrage n'est plus qu'une trace claire au centre, c'est
         assumé : c'est le disque qui identifie, et une icône d'onglet qui
         ne ressemblerait à aucune autre déclinaison ne servirait pas la
         marque, même lisible.

         La variante de thème va dans le sens SOMBRE et non clair : le
         disque est noir, donc il se détache très bien d'une barre claire,
         mais se fond dans une barre sombre (contraste mesuré 1,07:1 contre
         le fond du site). La variante sombre porte donc un filet clair,
         posé sur le bord du disque. -->
    <link rel="icon" href="brand/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="brand/favicon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="brand/favicon-dark-16.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="SONAA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Partage. Les métadonnées Open Graph exigent une URL ABSOLUE par
         spécification : c'est la seule exception à la règle du chemin relatif,
         et elle est déclarée ici une fois pour toutes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SONAA" />
    <meta property="og:title" content="SONAA" />
    <meta
      property="og:description"
      content="Atlas généalogique des musiques électroniques. 218 genres, 14 familles, écoute par le lecteur officiel YouTube."
    />
    <meta property="og:url" content="https://massivemedias.github.io/Sonaa/" />
    <meta property="og:image" content="https://massivemedias.github.io/Sonaa/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le logotype SONAA, calligraphié, sur fond sombre." />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SONAA" />
    <meta
      name="twitter:description"
      content="Atlas généalogique des musiques électroniques. 218 genres, 14 familles."
    />
    <meta name="twitter:image" content="https://massivemedias.github.io/Sonaa/og.png" />
  </head>
  <body>
    <!-- État de chargement : visible dès le premier octet de HTML, remplacé
         par React au montage. Sans lui, l'écran restait noir pendant le
         chargement du corpus et de la couche 3D. Styles inline exprès : ils
         doivent exister avant toute feuille de style. -->
    <div id="root">
      <div
        id="sonaa-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0a0c10;
          color: #8b93a7;
          font-family: system-ui, sans-serif;
          font-size: 12px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        "
      >
        <img src="brand/sonaa-logo.png" alt="SONAA" style="height: 44px; opacity: 0.9" />
        <p style="margin: 0">chargement de l&rsquo;atlas</p>
        <div
          style="
            width: 120px;
            height: 2px;
            background: #1d2230;
            overflow: hidden;
            border-radius: 1px;
          "
        >
          <div
            style="
              width: 40%;
              height: 100%;
              background: #8b93a7;
              animation: sonaa-load 1.1s ease-in-out infinite alternate;
            "
          ></div>
        </div>
        <style>
          @keyframes sonaa-load {
            from { transform: translateX(-40px); }
            to { transform: translateX(120px); }
          }
          @media (prefers-reduced-motion: reduce) {
            #sonaa-splash div div { animation: none; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
