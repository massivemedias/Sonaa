<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SONAA</title>
    <meta
      name="description"
      content="Le calendrier complet des musiques électroniques : toutes les soirées de votre ville, par style, et l’atlas des 219 genres pour savoir d’où ça vient."
    />
    <meta name="color-scheme" content="dark light" />

    <!-- LE THEME EST POSE AVANT LA PREMIERE PEINTURE, ET C'EST TOUT L'INTERET
         DE CE FRAGMENT. Pose plus tard, au montage de React, la page rendrait
         d'abord en sombre puis basculerait : un eclair noir a chaque
         chargement, pour qui a choisi le clair. Quatre lignes en ligne valent
         mieux qu'un defaut qu'on ne peut pas rattraper apres coup.

         Il ne lit rien d'autre que son propre reglage, il n'ecrit rien, et il
         echoue en silence : sans stockage accessible, on suit le systeme, ce
         qui est deja la bonne reponse par defaut. -->
    <script>
      (function () {
        try {
          var choisi = localStorage.getItem('sonaa-theme');
          var clair =
            choisi === 'clair' ||
            (choisi === null && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (clair) {
            document.documentElement.setAttribute('data-theme', 'clair');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#f7f6f5');
          }
        } catch (e) {
          /* Navigation privee ou stockage refuse : le theme sombre reste. */
        }
      })();
    </script>
    <meta name="theme-color" content="#0a0c10" />

    <!-- Identité. Les chemins sont relatifs : le site est servi sous /Sonaa/ et
         aucune URL absolue vers le domaine n'est écrite en dur, sauf dans les
         métadonnées Open Graph, dont la spécification l'exige. -->
    <!-- Icônes. Deux familles, et la différence est assumée.

         LES GRANDES (apple-touch, 192, 512, masquable) portent le disque
         noir et le lettrage entier : à cette taille il est parfaitement
         lisible, et iOS comme Android appliquent de toute façon leur propre
         masque.

         CELLE DE L'ONGLET porte LE S SEUL, découpé dans le logo. Elle a été
         reprise deux fois le 3 septembre 2026, et la deuxième fois pour une
         raison qui vaut d'être écrite.

         Elle reprenait d'abord le disque entier, donc le lettrage réduit à
         une virgule claire qui ressemblait à une croche. Premier remède : un
         carré à coins arrondis, et le mot entier épaissi. On lisait
         « Sonaa », mais Mika a nommé ce qui restait faux : le mot est LARGE
         ET COURT, donc dans un carré il occupe une bande au milieu et laisse
         le haut et le bas vides. Trop petit.

         Le S, lui, est plus haut que large : il épouse la tuile au lieu de
         flotter dedans. À 32 pixels il en fait 29 de haut au lieu de 7,
         quatre fois plus de matière pour le même carré, et c'est une lettre
         du logo, pas un dessin nouveau. Le trait est épaissi avant
         réduction, ce que font les fondeurs pour les petits corps.

         Voir scripts/refaire-favicon.sh, qui explique aussi pourquoi la
         découpe se fait en deux temps : la barre traversante du S rejoint le
         « o », c'est une seule forme au sens du pixel et deux lettres au
         sens de la lecture.

         La variante de thème va dans le sens SOMBRE et non clair : la tuile
         est presque noire, donc elle se détache très bien d'une barre
         claire, mais se fond dans une barre sombre. La variante sombre porte
         donc un filet clair sur son bord. -->
    <link rel="icon" href="brand/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="brand/favicon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="brand/favicon-dark-16.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
    <!-- Le manifest est genere par vite-plugin-pwa, qui injecte lui-meme ce
         lien au build : le declarer ici en produirait deux. -->
    <meta name="apple-mobile-web-app-title" content="SONAA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

         edite a la main. -->

    <link rel="apple-touch-startup-image" href="brand/splash/splash-2732x2048.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

    <!-- Partage. Les métadonnées Open Graph exigent une URL ABSOLUE par
         spécification : c'est la seule exception à la règle du chemin relatif,
         et elle est déclarée ici une fois pour toutes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SONAA" />
    <!-- LE TITRE PARTAGÉ N'EST PAS LE TITRE D'ONGLET. « SONAA » suffit dans
         un onglet, où le favicon et l'URL disent le reste ; dans une bulle
         iMessage ou une carte Instagram, c'est la ligne la plus lue et
         souvent la seule, et un mot inventé n'y apprend rien à personne. -->
    <meta property="og:title" content="SONAA, le calendrier complet des musiques électroniques" />
    <meta
      property="og:description"
      content="Toutes les soirées électroniques de votre ville, par style : techno, house, trance, drum and bass… Et l’atlas des 219 genres pour savoir d’où ça vient."
    />
    <meta property="og:url" content="https://sonaa.ca/" />
    <!-- L'IMAGE A CHANGÉ DE NOM, PAS SEULEMENT DE CONTENU : Facebook et
         iMessage gardent l'ancienne en cache par adresse, et une nouvelle
         adresse est la seule façon sûre de la faire remplacer partout. -->
    <meta property="og:image" content="https://sonaa.ca/og-calendrier.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Le texte alternatif décrit L'IMAGE SERVIE. Il a décrit le logotype
         seul jusqu'à ce que l'image devienne une capture de l'atlas : il
         mentait depuis, et c'est lui que lisent les lecteurs d'écran sur les
         réseaux. -->
    <meta
      property="og:image:alt"
      content="Le logotype SONAA en lettrage blanc sur fond sombre, avec la phrase « Le calendrier complet des musiques électroniques »."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SONAA, le calendrier complet des musiques électroniques" />
    <meta
      name="twitter:description"
      content="Toutes les soirées électroniques de votre ville, par style. Et l’atlas des 219 genres."
    />
    <meta name="twitter:image" content="https://sonaa.ca/og-calendrier.png" />
    <meta
      name="twitter:image:alt"
      content="Le logotype SONAA en lettrage blanc sur fond sombre, avec la phrase « Le calendrier complet des musiques électroniques »."
    />
  </head>
  <body>
    <!-- État de chargement : visible dès le premier octet de HTML, remplacé
         par React au montage. Sans lui, l'écran restait noir pendant le
         chargement du corpus et de la couche 3D. Styles inline exprès : ils
         doivent exister avant toute feuille de style. -->
    <div id="root">
      <div
        id="sonaa-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0a0c10;
          color: #8b93a7;
          font-family: system-ui, sans-serif;
          font-size: 12px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        "
      >
        <img src="brand/sonaa-logo.png" alt="SONAA" style="height: 44px; opacity: 0.9" />
        <p style="margin: 0">chargement de l&rsquo;atlas</p>
        <div
          style="
            width: 120px;
            height: 2px;
            background: #1d2230;
            overflow: hidden;
            border-radius: 1px;
          "
        >
          <div
            style="
              width: 40%;
              height: 100%;
              background: #8b93a7;
              animation: sonaa-load 1.1s ease-in-out infinite alternate;
            "
          ></div>
        </div>
        <style>
          @keyframes sonaa-load {
            from { transform: translateX(-40px); }
            to { transform: translateX(120px); }
          }
          @media (prefers-reduced-motion: reduce) {
            #sonaa-splash div div { animation: none; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
