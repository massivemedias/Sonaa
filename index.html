<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SONAA</title>
    <meta
      name="description"
      content="Atlas généalogique des musiques électroniques. 218 genres, 14 familles, écoute par le lecteur officiel YouTube."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c10" />

    <!-- Identité. Les chemins sont relatifs : le site est servi sous /Sonaa/ et
         aucune URL absolue vers le domaine n'est écrite en dur, sauf dans les
         métadonnées Open Graph, dont la spécification l'exige. -->
    <!-- Icônes : toutes issues de SonaaLogoCircle.png, le logo rond, jamais
         redessinées, et toutes le disque ENTIER, favicons compris. À 16
         pixels le lettrage n'est plus qu'une trace claire au centre, c'est
         assumé : c'est le disque qui identifie, et une icône d'onglet qui
         ne ressemblerait à aucune autre déclinaison ne servirait pas la
         marque, même lisible.

         La variante de thème va dans le sens SOMBRE et non clair : le
         disque est noir, donc il se détache très bien d'une barre claire,
         mais se fond dans une barre sombre (contraste mesuré 1,07:1 contre
         le fond du site). La variante sombre porte donc un filet clair,
         posé sur le bord du disque. -->
    <link rel="icon" href="brand/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="brand/favicon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="brand/favicon-dark-16.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
    <!-- Le manifest est genere par vite-plugin-pwa, qui injecte lui-meme ce
         lien au build : le declarer ici en produirait deux. -->
    <meta name="apple-mobile-web-app-title" content="SONAA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Ecrans de lancement iOS. Safari exige un fichier a la resolution
         EXACTE de l appareil : une taille absente donne un ecran blanc, il
         ne redimensionne rien. Genere par scripts/build-brand.sh, jamais
         edite a la main. -->
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2556x1179.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2796x1290.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2532x1170.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2778x1284.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2436x1125.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2688x1242.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1792x828.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1334x750.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1640x2360.png"
      media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2360x1640.png"
      media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1668x2388.png"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2388x1668.png"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2048x1536.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-1620x2160.png"
      media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2160x1620.png"
      media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2048x2732.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="brand/splash/splash-2732x2048.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

    <!-- Partage. Les métadonnées Open Graph exigent une URL ABSOLUE par
         spécification : c'est la seule exception à la règle du chemin relatif,
         et elle est déclarée ici une fois pour toutes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SONAA" />
    <!-- LE TITRE PARTAGÉ N'EST PAS LE TITRE D'ONGLET. « SONAA » suffit dans
         un onglet, où le favicon et l'URL disent le reste ; dans une bulle
         iMessage ou une carte Instagram, c'est la ligne la plus lue et
         souvent la seule, et un mot inventé n'y apprend rien à personne. -->
    <meta property="og:title" content="SONAA, l'atlas des musiques électroniques" />
    <meta
      property="og:description"
      content="Atlas généalogique des musiques électroniques. 218 genres, 14 familles, écoute par le lecteur officiel YouTube."
    />
    <meta property="og:url" content="https://sonaa.ca/" />
    <meta property="og:image" content="https://sonaa.ca/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Le texte alternatif décrit L'IMAGE SERVIE. Il a décrit le logotype
         seul jusqu'à ce que l'image devienne une capture de l'atlas : il
         mentait depuis, et c'est lui que lisent les lecteurs d'écran sur les
         réseaux. -->
    <meta
      property="og:image:alt"
      content="La carte SONAA, des sphères colorées reliées par leur filiation, chacune portant le nom d'un genre musical, sur fond sombre."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SONAA, l'atlas des musiques électroniques" />
    <meta
      name="twitter:description"
      content="Atlas généalogique des musiques électroniques. 218 genres, 14 familles."
    />
    <meta name="twitter:image" content="https://sonaa.ca/og.png" />
    <meta
      name="twitter:image:alt"
      content="La carte SONAA, des sphères colorées reliées par leur filiation, chacune portant le nom d'un genre musical, sur fond sombre."
    />
  </head>
  <body>
    <!-- État de chargement : visible dès le premier octet de HTML, remplacé
         par React au montage. Sans lui, l'écran restait noir pendant le
         chargement du corpus et de la couche 3D. Styles inline exprès : ils
         doivent exister avant toute feuille de style. -->
    <div id="root">
      <div
        id="sonaa-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0a0c10;
          color: #8b93a7;
          font-family: system-ui, sans-serif;
          font-size: 12px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        "
      >
        <img src="brand/sonaa-logo.png" alt="SONAA" style="height: 44px; opacity: 0.9" />
        <p style="margin: 0">chargement de l&rsquo;atlas</p>
        <div
          style="
            width: 120px;
            height: 2px;
            background: #1d2230;
            overflow: hidden;
            border-radius: 1px;
          "
        >
          <div
            style="
              width: 40%;
              height: 100%;
              background: #8b93a7;
              animation: sonaa-load 1.1s ease-in-out infinite alternate;
            "
          ></div>
        </div>
        <style>
          @keyframes sonaa-load {
            from { transform: translateX(-40px); }
            to { transform: translateX(120px); }
          }
          @media (prefers-reduced-motion: reduce) {
            #sonaa-splash div div { animation: none; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
