<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SONAA</title>
    <meta
      name="description"
      content="Atlas généalogique des musiques électroniques. 216 genres, 14 familles, écoute par le lecteur officiel YouTube."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c10" />

    <!-- Identité. Les chemins sont relatifs : le site est servi sous /Sonaa/ et
         aucune URL absolue vers le domaine n'est écrite en dur, sauf dans les
         métadonnées Open Graph, dont la spécification l'exige. -->
    <link rel="icon" href="brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="SONAA" />

    <!-- Partage. Les métadonnées Open Graph exigent une URL ABSOLUE par
         spécification : c'est la seule exception à la règle du chemin relatif,
         et elle est déclarée ici une fois pour toutes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SONAA" />
    <meta property="og:title" content="SONAA" />
    <meta
      property="og:description"
      content="Atlas généalogique des musiques électroniques. 216 genres, 14 familles, écoute par le lecteur officiel YouTube."
    />
    <meta property="og:url" content="https://massivemedias.github.io/Sonaa/" />
    <meta property="og:image" content="https://massivemedias.github.io/Sonaa/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SONAA, et les quatorze teintes de ses familles de genres." />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SONAA" />
    <meta
      name="twitter:description"
      content="Atlas généalogique des musiques électroniques. 216 genres, 14 familles."
    />
    <meta name="twitter:image" content="https://massivemedias.github.io/Sonaa/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
