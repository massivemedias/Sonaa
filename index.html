<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SONAA · Soirées électroniques et atlas des 219 styles</title>
    <link rel="canonical" href="https://sonaa.ca/" />
    <meta
      name="description"
      content="Le calendrier complet des musiques électroniques : toutes les soirées de votre ville, par style, et l’atlas des 219 genres pour savoir d’où ça vient."
    />
    <meta name="color-scheme" content="dark" />

    <!-- SOMBRE, ET RIEN D'AUTRE, depuis le 1er octobre 2026 : Mika, « enleve
         le bouton light mode, je veux juste un dark mode ». Il n'y a plus de
         theme a poser avant la premiere peinture : la feuille de style ne
         connait plus que le sombre. -->
    <meta name="theme-color" content="#0c0b09" />

    <!-- AUCUNE IMAGE CASSEE NE S'AFFICHE, NULLE PART. Mika, le 30 septembre
         2026 : « je ne veux jamais voir ce genre de chose ». Toute image qui
         echoue est marquee ici, en phase de capture, avant meme que le code
         de la page soit charge ; design/base.css la cache. Les composants
         qui savent mieux faire (une affiche dessinee, une tuile retiree) le
         font en plus ; ceci est le filet sous tout le reste. -->
    <script>
      addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (t && t.tagName === 'IMG') t.setAttribute('data-cassee', '');
        },
        true
      );
    </script>

    <!-- LE CONTENU PRE-RENDU A UNE COLONNE, LUI AUSSI.

         scripts/prerender.ts pose le texte de la page dans
         <main class="prerendu">, devant l'ecran de chargement, pour que les
         moteurs et les navigateurs sans script lisent quelque chose. Ce bloc
         n'etait touche par AUCUNE regle : sur un ecran large il s'etalait sur
         toute la fenetre, et une ligne de description y faisait plus de deux
         cents signes. La feuille de style de l'application le corrigerait,
         mais elle arrive avec le bundle, donc apres.

         Ces quelques lignes sont donc en ligne, comme le script de theme
         au-dessus et pour la meme raison : ce qui doit etre juste avant la
         premiere peinture ne peut pas attendre un telechargement.

         1240 px est ecrit en clair et non lu dans --largeur-page : ce jeton
         nait avec la feuille de style, c'est-a-dire trop tard pour ce bloc.
         Les deux valeurs doivent rester d'accord. -->
    <style>
      .prerendu {
        display: block;
        box-sizing: border-box;
        max-width: 1240px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }
      .prerendu p,
      .prerendu li {
        max-width: 70ch;
      }
      .prerendu img {
        max-width: 100%;
        height: auto;
      }
    </style>

    <!-- Identité. Les chemins partent de la racine, et ce n'était pas le cas.

         Ils étaient relatifs, écrits « brand/x.png », du temps où le site
         vivait sous github.io/Sonaa/ : à la racine d'alors, c'était juste.

         CE QUI A CHANGÉ SANS QUE CES LIGNES SUIVENT : le domaine propre, puis
         le pré-rendu. Cette coquille est désormais recopiée dans chacune des
         746 pages statiques, dont /styles/techno/detroit-techno/, où
         « brand/x.png » se résout en /styles/techno/detroit-techno/brand/x.png.
         Trente-trois chemins répondaient 404 sur toutes les pages sauf la
         racine : les favicons, l'icône Apple, les neuf écrans de démarrage iOS
         et le logo de l'écran de chargement.

         Personne ne pouvait le voir en développant : on ouvre la racine, et à
         la racine tout allait bien. Corrigé le 21 septembre 2026, et tenu par
         src/lib/coquille.test.ts, qui lit ce fichier tel qu'il est livré.

         Aucune URL absolue vers le domaine n'est écrite en dur pour autant,
         sauf dans les métadonnées Open Graph, dont la spécification l'exige. -->
    <!-- Icônes : le logotype « Sonaa », le plus gros possible (Mika, 1er
         octobre 2026), rogné aux cinq lettres sur un carré presque noir.
         Il n'existe qu'en image : pas de SVG. La version 32 px est celle
         que prennent les onglets des écrans Retina. Voir
         scripts/refaire-favicon.sh. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <!-- Le manifest est genere par vite-plugin-pwa, qui injecte lui-meme ce
         lien au build : le declarer ici en produirait deux. -->
    <meta name="apple-mobile-web-app-title" content="SONAA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Ecrans de lancement iOS. Safari exige un fichier a la resolution
         EXACTE de l appareil : une taille absente donne un ecran blanc, il
         ne redimensionne rien. Genere par scripts/build-brand.sh, jamais
         edite a la main. -->
    <link rel="apple-touch-startup-image" href="/brand/splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/brand/splash/splash-2556x1179.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />

      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/brand/splash/splash-2778x1284.png"

    <link rel="apple-touch-startup-image" href="/brand/splash/splash-2436x1125.png"

      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/brand/splash/splash-2732x2048.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

    <!-- Partage. Les métadonnées Open Graph exigent une URL ABSOLUE par
         spécification : c'est la seule exception à la règle du chemin relatif,
         et elle est déclarée ici une fois pour toutes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SONAA" />
    <!-- LE TITRE PARTAGÉ N'EST PAS LE TITRE D'ONGLET. « SONAA » suffit dans
         un onglet, où le favicon et l'URL disent le reste ; dans une bulle
         iMessage ou une carte Instagram, c'est la ligne la plus lue et
         souvent la seule, et un mot inventé n'y apprend rien à personne. -->
    <meta property="og:title" content="SONAA, le calendrier complet des musiques électroniques" />
    <meta
      property="og:description"
      content="Toutes les soirées électroniques de votre ville, par style : techno, house, trance, drum and bass… Et l’atlas des 219 genres pour savoir d’où ça vient."
    />
    <meta property="og:url" content="https://sonaa.ca/" />
    <!-- L'IMAGE A CHANGÉ DE NOM, PAS SEULEMENT DE CONTENU : Facebook et
         iMessage gardent l'ancienne en cache par adresse, et une nouvelle
         adresse est la seule façon sûre de la faire remplacer partout. -->
    <meta property="og:image" content="https://sonaa.ca/og-calendrier.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Le texte alternatif décrit L'IMAGE SERVIE. Il a décrit le logotype
         seul jusqu'à ce que l'image devienne une capture de l'atlas : il
         mentait depuis, et c'est lui que lisent les lecteurs d'écran sur les
         réseaux. -->
    <meta
      property="og:image:alt"
      content="Le logotype SONAA en lettrage blanc sur fond sombre, avec la phrase « Le calendrier complet des musiques électroniques »."
    />
    <meta property="og:locale" content="fr_FR" />
    <!-- CE QUE LE SITE EST, DIT AUX MOTEURS : un site web avec sa recherche
         et l'organisation qui le fait. Les fiches de styles et les soirées
         portent chacune leur propre bloc, ecrit par scripts/prerender.ts. -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"WebSite","@id":"https://sonaa.ca/#site","url":"https://sonaa.ca/","name":"SONAA","inLanguage":"fr","description":"Le calendrier des soirées électroniques et l’atlas des 219 styles de musique électronique, avec un cours de production par style.","publisher":{"@id":"https://sonaa.ca/#org"}},
        {"@type":"Organization","@id":"https://sonaa.ca/#org","name":"SONAA","url":"https://sonaa.ca/","logo":"https://sonaa.ca/brand/sonaa-logo.png","foundingLocation":"Montréal","sameAs":["https://github.com/massivemedias/Sonaa"]}
      ]}
    </script>
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SONAA, le calendrier complet des musiques électroniques" />
    <meta
      name="twitter:description"
      content="Toutes les soirées électroniques de votre ville, par style. Et l’atlas des 219 genres."
    />
    <meta name="twitter:image" content="https://sonaa.ca/og-calendrier.png" />
    <meta
      name="twitter:image:alt"
      content="Le logotype SONAA en lettrage blanc sur fond sombre, avec la phrase « Le calendrier complet des musiques électroniques »."
    />
  </head>
  <body>
    <!-- État de chargement : visible dès le premier octet de HTML, remplacé
         par React au montage. Sans lui, l'écran restait noir pendant le
         chargement du corpus et de la couche 3D. Styles inline exprès : ils
         doivent exister avant toute feuille de style. -->
    <div id="root">
      <div
        id="sonaa-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0c0b09;
          color: #a5a29b;
          font-family: system-ui, sans-serif;
          font-size: 12px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        "
      >
        <img src="/brand/sonaa-logo.png" alt="SONAA" style="height: 44px; opacity: 0.9" />
        <p style="margin: 0">chargement de l&rsquo;atlas</p>
        <div
          style="
            width: 120px;
            height: 2px;
            background: #3b3731;
            overflow: hidden;
            border-radius: 1px;
          "
        >
          <div
            style="
              width: 40%;
              height: 100%;
              background: #a5a29b;
              animation: sonaa-load 1.1s ease-in-out infinite alternate;
            "
          ></div>
        </div>
        <style>
          @keyframes sonaa-load {
            from { transform: translateX(-40px); }
            to { transform: translateX(120px); }
          }
          @media (prefers-reduced-motion: reduce) {
            #sonaa-splash div div { animation: none; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
