name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deux commits : il faut le precedent pour savoir ce qui a change.
          fetch-depth: 2

      # QUELS FICHIERS ONT CHANGE.
      #
      # Le controle du plafond anti-parution interroge YouTube, et YouTube
      # repond ou ne repond pas selon le moment et l'adresse appelante. Il a
      # fait echouer une publication qui ne touchait meme pas au corpus. Un
      # controle qui bloque des publications sans rapport avec lui detruit la
      # confiance dans toute la chaine : on finit par le contourner, et le
      # jour ou il a raison personne ne l'ecoute.
      #
      # Il ne s'execute donc que si les DONNEES ou le matcher ont bouge,
      # c'est-a-dire quand ce qu'il protege est reellement en jeu. Sur un
      # declenchement manuel, ou si la comparaison est impossible, il
      # s'execute : en cas de doute on controle.
      - name: Reperer ce qui a change
        id: change
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "donnees=true" >> "$GITHUB_OUTPUT"
            echo "Declenchement manuel : controle des donnees execute."
            exit 0
          fi
          AVANT="${{ github.event.before }}"
          if [ -z "$AVANT" ] || [ "$AVANT" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            echo "donnees=true" >> "$GITHUB_OUTPUT"
            echo "Etat precedent introuvable : controle des donnees execute."
            exit 0
          fi
          FICHIERS=$(git diff --name-only "$AVANT" "${{ github.sha }}")
          echo "$FICHIERS"
          if echo "$FICHIERS" | grep -qE '^(src/data/|scripts/lib/match\.ts|scripts/check-plafond\.ts|scripts/import-tracks\.ts|scripts/fetch-)'; then
            echo "donnees=true" >> "$GITHUB_OUTPUT"
          else
            echo "donnees=false" >> "$GITHUB_OUTPUT"
            echo "Aucune donnee touchee : controle du plafond ignore."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Garde-fou du matcher d'identifiants YouTube. Dix cas issus du corpus
      # réel : quatre faux qu'une version permissive avait laissés passer, six
      # justes qu'une version trop stricte rejetait. Voir ADR-035.
      - name: Contrôler le matcher
        run: npm run check:matcher

      # Le label d'un genre affiche le nom seul. Un suffixe « · 3 » a déjà été
      # pris pour un identifiant technique : ce contrôle rend la récidive
      # impossible. Voir scripts/check-labels.ts.
      - name: Contrôler les labels
        run: npm run check:labels

      - name: Un seul chemin d'écriture du corpus
        run: npm run check:writes

      # Aucun tiret cadratin ni demi-cadratin, y compris dans les commentaires :
      # un « — » s'était glissé jusque dans l'interface, entre le nom d'artiste
      # et le titre sur la liste des propositions. Voir scripts/check-tirets.ts.
      # DEUX SOURCES DE VERITE POUR UNE VALEUR : le motif qui revient le plus
      # souvent dans ce projet, sous des formes differentes. En CSS il prend
      # celle-ci : deux regles pour le meme selecteur, et c'est la derniere qui
      # gagne, pas celle qu'on lit. La zone de saisie de la barre de lecture
      # annoncait 44 px et en mesurait 24 pour cette raison. Cinq autres cas
      # dormaient dans la feuille au premier passage du controle.
      - name: Contrôler les doublons CSS
        run: npm run check:css

      # DEUX CORRECTIONS CONTINUES SUR LA CAMERA SE TIRENT DESSUS, chacune vers
      # sa propre idee du bon cadrage, et la carte derive sans que personne ne
      # l'ait demande. C'est arrive DEUX FOIS en deux jours, et le motif est
      # invisible a la lecture : chaque correcteur, pris seul, est raisonnable.
      # Seul un compte les attrape. Toute ecriture sur l'etat de camera dans la
      # boucle de rendu doit desormais etre declaree, avec sa raison.
      - name: Contrôler les corrections de caméra
        run: npm run check:camera

      # LE SEUL MOTIF DE CE PROJET QUI RESISTE A LA DOCUMENTATION : deux
      # endroits ecrivent la meme valeur, le dernier gagne, et rien ne le
      # signale parce que chaque ligne est correcte prise seule. Ce qui est
      # faux n'est dans aucune des deux, il est dans leur ORDRE, et l'ordre ne
      # s'ecrit nulle part. Trois occurrences en une session, la regle etant
      # deja ecrite avant la deuxieme. Ce controle oblige a DECLARER l'ordre,
      # donc a se demander lequel doit gagner, donc a voir le conflit.
      - name: Contrôler les écritures concurrentes
        run: npm run check:ecritures

      # UNE REGLE VIOLEE DEUX FOIS PAR CELUI QUI L'A ECRITE N'EST PAS UNE REGLE,
      # c'est un souhait. « Le cadrage est un geste, pas un asservissement
      # permanent » a ete ecrit apres six tours de recherche, puis reintroduit
      # trois jours plus tard en corrigeant autre chose. Le controle exige
      # desormais que tout recadrage declare QUAND IL S'ARRETE : un temps
      # ecoule, une constante en millisecondes, ou un drapeau a un coup.
      - name: Contrôler les recadrages sans fin
        run: npm run check:cadrage

      # LA MEME GRANDEUR ECRITE DANS DEUX FICHIERS. Le controle des doublons CSS
      # ne voyait que deux declarations de la meme propriete dans la meme regle.
      # La hauteur de la feuille mobile, elle, valait 42 dans un fichier et 70
      # dans l'autre : chaque fichier etait coherent avec lui-meme, et un tiers
      # de la carte vivait derriere la feuille. Aucun des defauts visibles ne
      # ressemblait a sa cause.
      - name: Contrôler les grandeurs écrites deux fois
        run: npm run check:constantes

      - name: Contrôler les tirets
        run: npm run check:tirets

      # LE GARDE-FOU DU GARDE-FOU. Le plafond de quinze minutes a cessé de
      # mordre sans rien dire : l'extraction de la durée avait cessé de
      # correspondre, et un contrôle qui ne reçoit plus sa donnée d'entrée
      # rend « rien à signaler » au lieu d'alerter. Quarante-cinq intégrales
      # d'album sont entrées ainsi. Ce contrôle vérifie la règle ET que la
      # durée arrive encore. Voir scripts/check-plafond.ts.
      - name: Contrôler le plafond anti-parution
        if: steps.change.outputs.donnees == 'true'
        run: npm run check:plafond

      # Le matcher compare des mots : « Karlheinz Stockhausen explains Kontakte »
      # contient l'artiste et le titre, passe le seuil de similarite, le plafond
      # de duree et le rejet des parutions. C'est une interview. Trente-six
      # remplacements ont ete annules pour ce motif, dont une bande-annonce
      # d'album et une video sur des brevets d'OVNI. Aucun score de ressemblance
      # ne peut attraper cela : le probleme est la NATURE du document.
      # Les cas de test sont tires de ces erreurs reelles.
      - name: Controler le filtre de nature
        run: npm run check:nature

      # Deux spheres exactement superposees font scintiller le rendu : le GPU
      # ne peut pas trancher laquelle est devant et son arbitrage change a
      # chaque image. En vue d'ensemble, 130 genres sont replies sur leur
      # ancetre, ce qui fait 499 paires a distance nulle. Le repli est VOULU ;
      # ce qui ne l'est pas, c'est de les montrer avant qu'elles se soient
      # ecartees. Un seuil trop bas a coute six signalements et cinq
      # corrections cherchees dans le shader. Voir scripts/check-superposition.ts
      - name: Controler les superpositions de spheres
        run: npm run check:superposition

      # Fait autorité sur les données : cycles, références mortes, orphelins,
      # doublons d'identifiants, couverture par genre. Voir ADR-005.
      - name: Valider les données
        run: npm run validate:data

      # Les deux seules variables du projet. Elles sont volontairement
      # publiques : la clé est la clé « publishable » de Supabase, faite pour
      # vivre dans un bundle, et ce sont les politiques RLS qui protègent les
      # données. Si elles manquent, le build réussit quand même et le site
      # se déploie sans la contribution — c'est le contrat de lib/supabase.ts.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # SONAA embarque désormais une clé publique, et une seule. Ce contrôle
      # sépare les deux cas : les motifs de secrets tiers restent interdits,
      # et surtout AUCUNE clé de service Supabase ne doit atteindre dist/ —
      # celle-là contourne toutes les politiques RLS. Référence : ADR-011.
      - name: Vérifier qu'aucun secret n'a traversé le build
        run: |
          if grep -rEl 'ghp_|github_pat_|AIza|sk-[A-Za-z0-9]{16}' dist/; then
            echo "::error::Motif de secret détecté dans dist/, déploiement interrompu."
            exit 1
          fi
          # Le motif vise une VRAIE clé, pas sa mention : lib/supabase.ts
          # contient les chaînes « sb_secret_ » et « service_role » dans sa
          # propre garde, et un grep naïf se déclenchait dessus. On exige
          # donc la suite de caractères qui suit un vrai préfixe de clé.
          if grep -rEl 'sb_secret_[A-Za-z0-9_-]{15,}' dist/; then
            echo "::error::Une clé de service Supabase a atteint dist/. Elle ignore toutes les politiques RLS."
            exit 1
          fi
          # Aucun JWT ne doit se trouver dans le bundle : la clé publique du
          # projet est au format « publishable », pas au format JWT. Un JWT
          # ici serait donc soit une ancienne clé anon, soit une service_role.
          if grep -rEl 'eyJhbGciOi[A-Za-z0-9_.-]{60,}' dist/; then
            echo "::error::Un jeton JWT est présent dans dist/. Aucun n'est attendu."
            exit 1
          fi
          echo "Aucun motif de secret dans dist/, aucune clé de service, aucun JWT."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
