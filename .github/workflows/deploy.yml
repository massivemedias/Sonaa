name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Garde-fou du matcher d'identifiants YouTube. Dix cas issus du corpus
      # réel : quatre faux qu'une version permissive avait laissés passer, six
      # justes qu'une version trop stricte rejetait. Voir ADR-035.
      - name: Contrôler le matcher
        run: npm run check:matcher

      # Le label d'un genre affiche le nom seul. Un suffixe « · 3 » a déjà été
      # pris pour un identifiant technique : ce contrôle rend la récidive
      # impossible. Voir scripts/check-labels.ts.
      - name: Contrôler les labels
        run: npm run check:labels

      - name: Un seul chemin d'écriture du corpus
        run: npm run check:writes

      # Aucun tiret cadratin ni demi-cadratin, y compris dans les commentaires :
      # un « — » s'était glissé jusque dans l'interface, entre le nom d'artiste
      # et le titre sur la liste des propositions. Voir scripts/check-tirets.ts.
      - name: Contrôler les tirets
        run: npm run check:tirets

      # LE GARDE-FOU DU GARDE-FOU. Le plafond de quinze minutes a cessé de
      # mordre sans rien dire : l'extraction de la durée avait cessé de
      # correspondre, et un contrôle qui ne reçoit plus sa donnée d'entrée
      # rend « rien à signaler » au lieu d'alerter. Quarante-cinq intégrales
      # d'album sont entrées ainsi. Ce contrôle vérifie la règle ET que la
      # durée arrive encore. Voir scripts/check-plafond.ts.
      - name: Contrôler le plafond anti-parution
        run: npm run check:plafond

      # Fait autorité sur les données : cycles, références mortes, orphelins,
      # doublons d'identifiants, couverture par genre. Voir ADR-005.
      - name: Valider les données
        run: npm run validate:data

      # Les deux seules variables du projet. Elles sont volontairement
      # publiques : la clé est la clé « publishable » de Supabase, faite pour
      # vivre dans un bundle, et ce sont les politiques RLS qui protègent les
      # données. Si elles manquent, le build réussit quand même et le site
      # se déploie sans la contribution — c'est le contrat de lib/supabase.ts.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # SONAA embarque désormais une clé publique, et une seule. Ce contrôle
      # sépare les deux cas : les motifs de secrets tiers restent interdits,
      # et surtout AUCUNE clé de service Supabase ne doit atteindre dist/ —
      # celle-là contourne toutes les politiques RLS. Référence : ADR-011.
      - name: Vérifier qu'aucun secret n'a traversé le build
        run: |
          if grep -rEl 'ghp_|github_pat_|AIza|sk-[A-Za-z0-9]{16}' dist/; then
            echo "::error::Motif de secret détecté dans dist/, déploiement interrompu."
            exit 1
          fi
          # Le motif vise une VRAIE clé, pas sa mention : lib/supabase.ts
          # contient les chaînes « sb_secret_ » et « service_role » dans sa
          # propre garde, et un grep naïf se déclenchait dessus. On exige
          # donc la suite de caractères qui suit un vrai préfixe de clé.
          if grep -rEl 'sb_secret_[A-Za-z0-9_-]{15,}' dist/; then
            echo "::error::Une clé de service Supabase a atteint dist/. Elle ignore toutes les politiques RLS."
            exit 1
          fi
          # Aucun JWT ne doit se trouver dans le bundle : la clé publique du
          # projet est au format « publishable », pas au format JWT. Un JWT
          # ici serait donc soit une ancienne clé anon, soit une service_role.
          if grep -rEl 'eyJhbGciOi[A-Za-z0-9_.-]{60,}' dist/; then
            echo "::error::Un jeton JWT est présent dans dist/. Aucun n'est attendu."
            exit 1
          fi
          echo "Aucun motif de secret dans dist/, aucune clé de service, aucun JWT."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
