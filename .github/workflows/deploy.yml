name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # SONAA n'a ni backend, ni clé, ni variable d'environnement. Ce contrôle
      # interdit la récidive : aucun motif ressemblant à un secret ne peut
      # atteindre la production. Référence : ARCHITECTURE.md ADR-011.
      - name: Vérifier qu'aucun secret n'a traversé le build
        run: |
          if grep -rEl 'ghp_|github_pat_|AIza|sk-[A-Za-z0-9]{16}' dist/; then
            echo "::error::Motif de secret détecté dans dist/, déploiement interrompu."
            exit 1
          fi
          echo "Aucun motif de secret dans dist/."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
