# LA MOISSON DES NEWS, DEUX FOIS PAR JOUR.
#
# Elle relit les flux des magazines (scripts/moissonner-news.ts), reecrit
# public/news.json, et si le fichier a change, le commet et demande la
# publication. Voir NewsPage.tsx pour ce que le site en fait.
#
# POURQUOI ELLE DECLENCHE LA PUBLICATION ELLE-MEME. Un commit pousse par le
# jeton d'une action ne declenche pas les autres actions : c'est une regle
# de GitHub, pour eviter les boucles. Sans l'appel explicite ci-dessous, le
# fichier serait a jour dans le depot et vieux sur le site.

name: Moisson des news

on:
  schedule:
    # DEUX PASSES, 8 h et 20 h a Montreal, ecrites en UTC. Elle tournait
    # toutes les quatre heures jusqu'au 21 septembre 2026 : depuis que les
    # titres sont traduits, chaque passe coute, et les magazines ne publient
    # pas six fois par jour. Le matin ramasse la nuit europeenne, le soir
    # ramasse la journee nord-americaine.
    #
    # LA MINUTE 17 EST VOULUE : GitHub retarde les taches posees a l'heure
    # ronde, quand tout le monde en demande une.
    #
    # L'HEURE AVANCEE N'EXISTE PAS POUR CRON. Ces heures sont justes de mars
    # a novembre ; l'hiver, la moisson passe a 7 h et 19 h. Un decalage
    # d'une heure sur une liste de news ne vaut pas deux calendriers.
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  moissonner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependances
        run: npm ci

      - name: Moissonner
        # LA CLE DE TRADUCTION EST FACULTATIVE, ET C'EST VOULU. Sans elle, la
        # moisson tourne et ecrit les articles en anglais ; elle ne tombe pas.
        # Voir scripts/lib/traduire.ts et docs/NEWS-TRADUCTION.md.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run moissonner:news

      - name: Commettre si le fichier a change
        id: commit
        run: |
          # -I ignore la ligne de la date de releve : sans article nouveau,
          # rien n'est commis.
          if git diff --quiet -I '^ *"fait":' -- public/news.json; then
            echo "change=non" >> "$GITHUB_OUTPUT"
            echo "Rien de neuf."
          else
            git config user.name "moisson-news"
            git config user.email "moisson-news@users.noreply.github.com"
            git add public/news.json
            git commit -m "News : moisson du $(date -u +%Y-%m-%d\ %H:%M) UTC"
            # La branche a pu avancer pendant la moisson : rebase, puis pousse.
            for essai in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 20
            done
            echo "change=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier
        if: steps.commit.outputs.change == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
