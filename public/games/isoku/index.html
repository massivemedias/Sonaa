<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Isoku a déménagé</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12152a;color:#e8ebf5;font:600 16px system-ui,sans-serif;text-align:center;padding:20px}a{color:#ffb454}</style>
</head>
<body>
<p>Isoku a déménagé sur <a id="lnk" href="https://massivemedias.com/isoku/">massivemedias.com/isoku</a>.<br>Ta progression suit, un instant…</p>
<script>
/* Ancienne adresse (sonaa.ca/games/isoku) : on emporte la progression locale dans le fragment #import=, puis on redirige. */
(function(){
  var target='https://massivemedias.com/isoku/';
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}
    var data={};var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^isoku\./.test(k))keys.push(k);}
    /* le profil, les reglages, la session et la camera d'abord, les parties en cours ensuite si la place le permet */
    keys.sort(function(a,b){var pa=/profile|settings|session|cam/.test(a)?0:1,pb=/profile|settings|session|cam/.test(b)?0:1;return pa-pb;});
    var size=0;for(var j=0;j<keys.length;j++){var v=localStorage.getItem(keys[j]);if(size+v.length>60000)continue;data[keys[j]]=v;size+=v.length;}
    if(keys.length){var b=btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');target+='#import='+b;}
  }catch(e){}
  document.getElementById('lnk').href=target;
  setTimeout(function(){location.replace(target);},150);
})();
</script>
</body>
</html>
