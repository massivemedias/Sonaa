<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- S calligraphique dessiné POUR la petite taille : topologie de S (le
       recadrage du monogramme se lisait « d » à 16 px, mesuré), plume large
       simulée par double trait décalé, penche cursive, amorces de parafe.
       Épaisseur minimale 2,3 px à l'échelle 16, contreformes ouvertes.
       Le fond et l'encre basculent avec le thème du navigateur. -->
  <style>
    .bg { fill: #f2f4f8; }
    .s { stroke: #0a0c10; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0c10; }
      .s { stroke: #f2f4f8; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="32" height="32" rx="7" />
  <g transform="translate(16 16) skewX(-8) translate(-16 -16)" fill="none" stroke-linecap="round">
    <path class="s" d="M 25.0 7.2 C 23.6 5.3 21.0 4.6 18.4 4.8 C 13.6 5.2 10.6 7.3 10.6 10.3 C 10.6 13.3 13.6 14.3 16.8 15.1 C 20.2 16.0 23.0 17.3 23.0 20.5 C 23.0 23.7 20.2 26.5 16.4 26.9 C 13.0 27.2 9.8 25.8 8.2 23.2 C 7.7 22.4 7.4 21.6 7.3 20.8" stroke-width="4.6" />
    <path class="s" d="M 25.0 7.2 C 23.6 5.3 21.0 4.6 18.4 4.8 C 13.6 5.2 10.6 7.3 10.6 10.3 C 10.6 13.3 13.6 14.3 16.8 15.1 C 20.2 16.0 23.0 17.3 23.0 20.5 C 23.0 23.7 20.2 26.5 16.4 26.9 C 13.0 27.2 9.8 25.8 8.2 23.2 C 7.7 22.4 7.4 21.6 7.3 20.8" stroke-width="4.6" transform="translate(0.75 0.95)" />
  </g>
</svg>
