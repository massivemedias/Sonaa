<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- S dessiné POUR la petite taille : trait quasi constant, contreformes
       ouvertes, aucun détail sous 2 px à l'échelle 16. Inspiré du mouvement
       du monogramme calligraphié, pas recadré dedans (le recadrage devenait
       une tache à 16 px, mesuré). Le fond et l'encre basculent avec le thème
       du navigateur. -->
  <style>
    .bg { fill: #f2f4f8; }
    .s { stroke: #0a0c10; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0c10; }
      .s { stroke: #f2f4f8; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="32" height="32" rx="7" />
  <path
    class="s"
    d="M 22.8 9.2 C 21.4 6.4 18.8 5.2 16 5.2 C 12 5.2 9.4 7.4 9.4 10.3 C 9.4 13.4 12.5 14.3 16 15.2 C 19.5 16.1 22.6 17.4 22.6 20.7 C 22.6 24 19.8 26.8 16 26.8 C 13 26.8 10 25.4 8.9 22.4"
    fill="none"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
