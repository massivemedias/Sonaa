<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SONAA · v2 (Phaser)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0716;overflow:hidden;
    font-family:"Nunito","Helvetica Neue",Arial,sans-serif;color:#f0e6d2}
  #jeu{position:fixed;inset:0}
  #jeu canvas{display:block;image-rendering:pixelated}
  .note{position:fixed;left:10px;top:10px;z-index:5;background:#241b33cc;border:2px solid #1c1528;
    padding:7px 10px;font-size:12px;font-weight:700;line-height:1.4;max-width:280px}
  .note b{color:#8fe8c8}
  .note a{color:#ffc857}
</style>
<div id="jeu"></div>
<div class="note">
  <b>v2 · Phaser 3.90, WebGL</b><br>
  Même monde, même logique, autre affichage.
  Flèches ou ZQSD, molette pour zoomer, clic pour marcher.<br>
  <a href="../">← revenir à la version canvas</a>
</div>
<script src="../vendor/phaser.min.js"></script>
<script type="module">
  import { Clairiere } from './scene.js';
  await document.fonts.ready;
  // poignee de debug, comme dans la v1
  window.jeu = new Phaser.Game({
    type: Phaser.WEBGL,
    parent: 'jeu',
    backgroundColor: '#16213f',
    pixelArt: true,
    roundPixels: true,
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.NO_CENTER },
    scene: [Clairiere],
  });
</script>
