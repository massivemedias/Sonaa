<meta charset="utf-8"><title>essai voxel</title>
<style>html,body{margin:0;height:100%;background:#121a30;overflow:hidden}</style>
<script type="importmap">
{ "imports": { "three": "/game/v3/vendor/three/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from '/game/v3/vendor/three/FBXLoader.js';

const sc = new THREE.Scene();
sc.background = new THREE.Color(0x121a30);
sc.fog = new THREE.Fog(0x121a30, 40, 130);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(Math.min(2, devicePixelRatio));
r.setSize(innerWidth, innerHeight);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);

// MEME CAMERA, MEME ECLAIRAGE QUE LA v3 DE NUIT
const d = 11, a = innerWidth / innerHeight;
const cam = new THREE.OrthographicCamera(-d*a, d*a, d, -d, -300, 500);
cam.position.set(20, 22, 20); cam.lookAt(0, 2, 0);
sc.add(new THREE.HemisphereLight(0x1d2647, 0x1f2a4a, 0.7));
const s = new THREE.DirectionalLight(0x7a90d6, 0.5);
s.position.set(20, 34, 10); s.castShadow = true;
s.shadow.mapSize.set(2048,2048);
Object.assign(s.shadow.camera, {left:-26,right:26,top:26,bottom:-26,near:1,far:120});
sc.add(s, s.target);
// deux lampadaires, comme dans le jeu
for (const p of [[-7,6],[8,-4]]) {
  const l = new THREE.PointLight(0xffd08a, 7, 16, 2);
  l.position.set(p[0], 2.4, p[1]); sc.add(l);
}
const sol = new THREE.Mesh(new THREE.PlaneGeometry(200,200),
  new THREE.MeshLambertMaterial({color:0x3c4048}));
sol.rotation.x = -Math.PI/2; sol.position.y = -0.02; sol.receiveShadow = true;
sc.add(sol);

const tex = new THREE.TextureLoader().load('/_essai/voxel/Textures/atlas.png');
tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false;
tex.magFilter = THREE.NearestFilter;

const plan = [
  ['BuildingBlock_1', -9, -6, 7], ['Building_3', -1, -7, 9],
  ['BuildingBlock_18', 7, -6, 8], ['BuildingBlock_2', -8, 3, 6],
  ['BuildingBlock_19', 1, 4, 7],  ['BuildingBlock_24', 9, 3, 6],
  ['Advertising_5', -4, -1, 3],   ['Advertising_7', 5, 0, 3],
  ['Road_Chunk_5', 0, 0, 6],      ['Sidewalk_Chunk_2', -6, 8, 5],
];
const L = new FBXLoader();
let faits = 0;
for (const [nom, x, z, taille] of plan) {
  L.load(`/_essai/voxel/${nom}.fbx`, o => {
    o.traverse(m => { if (m.isMesh) {
      m.castShadow = true; m.receiveShadow = true;
      // on garde la matiere livree avec le modele : c'est elle qu'on juge
      const mats = Array.isArray(m.material) ? m.material : [m.material];
      for (const mm of mats) if (mm && mm.map) mm.map.colorSpace = THREE.SRGBColorSpace;
    }});
    const b = new THREE.Box3().setFromObject(o);
    const t = b.getSize(new THREE.Vector3());
    o.scale.setScalar(taille / Math.max(t.x, t.z, 0.001));
    const b2 = new THREE.Box3().setFromObject(o);
    o.position.set(x, -b2.min.y, z);
    sc.add(o);
    document.title = 'pret ' + (++faits);
  }, undefined, e => console.error(nom, e));
}
(function boucle(){ requestAnimationFrame(boucle); r.render(sc, cam); })();
